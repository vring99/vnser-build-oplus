name:  Build一加SUKISU

on:
  workflow_dispatch:  # This allows this workflow to be called from another workflow
    inputs:
      KPM:
        type: boolean
        description: "是否启用内核模块(KPM)？"
        required: true
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:


          - file: oneplus_12_v
            kpm: true
            sched: false





          - file: oneplus_ace5_ultra
            kpm: true
            sched: true


          - file: oneplus_ace_6
            kpm: true
            sched: true



    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: ${{ matrix.sched }}
      ZRAM: true
      LSM: true
      FAST_BUILD: true
      KPM: ${{ inputs.KPM }}
