name:  Build一加SUKISU

on:
  workflow_dispatch:  # This allows this workflow to be called from another workflow
    inputs:
      KPM:
        type: boolean
        description: "是否启用内核模块(KPM)？"
        required: true
        default: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:





          - file: oneplus_ace5_pro
            kpm: true
            sched: true

          - file: oneplus_13
            kpm: true
            sched: true

          - file: oneplus_13_global
            kpm: true
            sched: true

          - file: oneplus_13t
            kpm: true
            sched: true

          - file: oneplus_13s
            kpm: true
            sched: true

          - file: oneplus_pad_2_pro
            kpm: true
            sched: true

          - file: oneplus_ace5_ultra
            kpm: true
            sched: true

          - file: oneplus_13_w
            kpm: true
            sched: true

          - file: oneplus_13t_w
            kpm: true
            sched: true

          - file: oneplus_13s_w
            kpm: true
            sched: true

          - file: oneplus_pad_3
            kpm: true
            sched: true

          - file: oneplus_ace6_w
            kpm: true
            sched: true

    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2025"
      SCHED: ${{ matrix.sched }}
      ZRAM: true
      LSM: true
      FAST_BUILD: true
      KPM: ${{ inputs.KPM }}
