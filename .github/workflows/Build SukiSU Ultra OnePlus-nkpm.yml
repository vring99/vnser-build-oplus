name:  Build一加SUKISU@vring-nkpm

on:
  workflow_dispatch:  # This allows this workflow to be called from another workflow

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:



          - file: oneplus_10_pro_v
            kpm: true
            sched: false

          - file: oneplus_10t_v
            kpm: true
            sched: false

          - file: oneplus_11r_v
            kpm: false
            sched: false

          - file: oneplus_ace2_v
            kpm: false
            sched: false

          - file: oneplus_ace_pro_v
            kpm: false
            sched: false

          - file: oneplus_11_v
            kpm: true
            sched: false



          - file: oneplus_ace2_pro_v
            kpm: true
            sched: false

          - file: oneplus_ace3_v
            kpm: true
            sched: false











    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: ${{ matrix.sched }}
      ZRAM: true
      LSM: true
      FAST_BUILD: true
      KPM: false
