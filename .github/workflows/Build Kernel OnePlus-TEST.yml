name: oplus-resukisu-vring-test

on:
  workflow_dispatch:  # This allows this workflow to be called from another workflow


jobs:
  vring-resukisu:
    name: "${{ matrix.file }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: oneplus_ace5_ultra_b_vring_89
            sched: true
            ipv6: false
          - file: oneplus_ace5_pro_89_b
            sched: true
            ipv6: false
          - file: oneplus_ace_6_89
            sched: true
            ipv6: false
          - file: oneplus_pad_2_pro_89_b
            sched: true
            ipv6: false


    #uses: ./.github/workflows/build-kernel-original-make-test.yml
    uses: ./.github/workflows/build-kernel-original-make.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      HOOK: "manual"
      SUSFS_CI: "NoN"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: ${{ matrix.sched }}
      ZRAM: false
      LSM: true
      FAST_BUILD: true
      IPV6: ${{ matrix.ipv6 }}

