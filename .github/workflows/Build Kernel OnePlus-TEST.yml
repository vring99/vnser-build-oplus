name: oplus-bakasu-vring-test

on:
  workflow_dispatch:  # This allows this workflow to be called from another workflow
    inputs:
      BAKASU_VERSION:
        description: "BakaSU Pro version"
        required: false
        type: choice
        options:
          - "35233"
        default: "35233"
      UNI:
        description: "启用 Unicode 绕过修复"
        required: false
        type: boolean
        default: false


jobs:
  vring-bakasu:
    name: "${{ matrix.file }}"
    strategy:
      fail-fast: false
      matrix:
        include:

          - file: oneplus_12_141
            sched: false
            ipv6: true

          - file: oneplus_ace3_pro_141
            sched: false
            ipv6: true
          - file: oneplus_ace3_pro_118
            sched: false
            ipv6: true

          - file: oneplus_ace5_118
            sched: false
            ipv6: true
          - file: oneplus_ace5_141
            sched: false
            ipv6: true

          - file: oneplus_ace6_ultra_vring
            sched: false
            ipv6: false
    #uses: ./.github/workflows/build-kernel-original-make-test.yml
    uses: ./.github/workflows/build-kernel-original-make.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      BAKASU_VERSION: ${{ inputs.BAKASU_VERSION || '35233' }}
      UNI: ${{ inputs.UNI }}
      HOOK: "manual"
      SUSFS_CI: "NoN"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: ${{ matrix.sched }}
      ZRAM: false
      LSM: true
      FAST_BUILD: true
      IPV6: ${{ matrix.ipv6 }}

