name:  Build一加RESUKISU@vring

on:
  workflow_dispatch:  # This allows this workflow to be called from another workflow


jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:

          - file: oneplus_pad_2_pro
            kpm: true
            sched: true
            ipv6: true
          - file: oneplus_13s
            kpm: true
            sched: true
            ipv6: true


          - file: oneplus_pad_3
            kpm: true
            sched: true
            ipv6: true
#          - file: oneplus_15
#            kpm: true
#            sched: true
#          - file: oneplus_15_vring
#            kpm: true
#            sched: false

    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: ${{ matrix.sched }}
      ZRAM: false
      LSM: true
      FAST_BUILD: true
      KPM: ${{ matrix.kpm }}
      IPV6: ${{ matrix.ipv6 }}