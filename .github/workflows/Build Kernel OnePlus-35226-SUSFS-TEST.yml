name: oplus-bakasu-35226-susfs-test

on:
  workflow_dispatch:
    inputs:
      FILE:
        description: "机型配置名（与现有编译入口相同）"
        required: true
        type: string

concurrency:
  group: oplus-bakasu-35226-susfs-test-${{ inputs.FILE }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: "${{ inputs.FILE }} / BakaSU 35226 / SUSFS SELinux"
    uses: ./.github/workflows/build-kernel-original-make.yml
    secrets: inherit
    with:
      FILE: ${{ inputs.FILE }}
      BAKASU_VERSION: "35226"
      HOOK: "manual"
      SUSFS_CI: "NoN"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME: "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: false
      ZRAM: false
      LSM: true
      FAST_BUILD: true
      IPV6: true
