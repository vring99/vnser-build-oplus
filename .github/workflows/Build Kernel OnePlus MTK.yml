name:  oplus-resukisu-vring-mtk

on:
  workflow_dispatch:  # This allows this workflow to be called from another workflow


jobs:
  vring-resukisu-mtk:
    name: "${{ matrix.file }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: oneplus_ace_v
            sched: false
            ipv6: false
          - file: oneplus_ace_u
            sched: false
            ipv6: false
          - file: oneplus_ace_race_v
            sched: false
            ipv6: false
          - file: oneplus_ace_race_u
            sched: false
            ipv6: false
          - file: oneplus_ace_2v_v
            sched: false
            ipv6: false
          - file: oneplus_ace_2v_b
            sched: false
            ipv6: false

          - file: oneplus_ace5_race_b
            sched: false
            ipv6: false

          - file: oneplus_ace5_race
            sched: false
            ipv6: false

          - file: oneplus_ace5_ultra_b_vring
            sched: true
            ipv6: false

          - file: oneplus_ace5_ultra
            sched: true
            ipv6: false

          - file: oneplus_ace5_ultra_b
            sched: true
            ipv6: false


          - file: oneplus_pad2_mt6991_b
            sched: true
            ipv6: false

          - file: oneplus_pad2_mt6991_v
            sched: false
            ipv6: false



          - file: oneplus_pad_mt6897_b
            sched: false
            ipv6: false

          - file: oneplus_pad_mt6897_v
            sched: false
            ipv6: false


          - file: oneplus_ace6_ultra_vring
            sched: false
            ipv6: false



    uses: ./.github/workflows/build-kernel-original-make.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: ${{ matrix.sched }}
      ZRAM: false
      LSM: true
      FAST_BUILD: true
      IPV6: ${{ matrix.ipv6 }}
