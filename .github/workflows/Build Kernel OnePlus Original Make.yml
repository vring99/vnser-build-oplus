name: oplus-resukisu-vring-original-make

on:
  workflow_dispatch:

jobs:
  vring-resukisu-original-make:
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: oneplus_ace_6t_Canary
            kpm: true
            sched: false
            ipv6: true


    uses: ./.github/workflows/build-kernel-original-make.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME: "Mon Aug 18 09:30:24 UTC 2024"
      SCHED: ${{ matrix.sched }}
      ZRAM: false
      LSM: true
      FAST_BUILD: true
      KPM: ${{ matrix.kpm }}
      IPV6: ${{ matrix.ipv6 }}
