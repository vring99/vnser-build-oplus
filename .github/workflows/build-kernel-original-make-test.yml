name: build-kernel-original-make-test
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: write   # Allows triggering actions

on:
  workflow_call:
    inputs:
      FILE:
        type: string
        description: "配置文件"
        required: true
        default: oneplus_ace2_pro_v

      HOOK:
        type: string
        description: "钩子选择"
        required: true
        default: manual

      SUSFS_CI:
        type: string
        description: "下载SUSFS模块调用方式"
        required: true
        default: NoN

      KSU_META:
        type: string
        description: "分支名(必填)/自定义版本标识(留空不修改)/调整提交hash(留空不修改)"
        required: false
        default: "susfs-main/vring/"
      BUILD_TIME:
        type: string
        description: "自定义构建时间 (输入F使用当前时间)"
        required: false
        default: "Mon Aug 18 09:30:24 UTC 2025"
      SUFFIX:
        type: string
        description: "自定义内核后缀 (不输入使用随机字符串)"
        required: false
        default: ""
      FAST_BUILD:
        type: boolean
        description: "是否启用极速构建？"
        required: true
        default: true
      LSM:
        type: boolean
        description: "是否启用内核层面阻止对关键分区/设备节点的非法写入(LSM)？"
        required: true
        default: false
      SCHED:
        type: boolean
        description: "是否添加风驰驱动？"
        required: true
        default: false
      ZRAM:
        type: boolean
        description: "是否添加更多ZRAM算法？"
        required: true
        default: false
      KPM:
        type: boolean
        description: "是否启用内核模块(KPM)？"
        required: true
        default: true
      IPV6:
        type: boolean
        description: "是否优化ipv6？"
        required: false
        default: true
jobs:
  load:
    name: ${{ inputs.SCHED  && ' [SCHED]' || '' }}${{ inputs.LSM  && ' [LSM]' || '' }}${{ inputs.KPM && ' [KPM]' || '' }}For ${{ inputs.FILE }} ${{ inputs.SUFFIX }}
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Extract OnePlus Manifest Info
        id: extract_info
        env:
          FILE: ${{ inputs.FILE }}
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          if [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; then
            FILE_CONF="${BASH_REMATCH[1]}"
          else
            FILE_CONF="$FILE"
          fi
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_bak//g; /_aosp/{s/_aosp//g;s/$/(AOSP)/;}; s/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/RealME/; s/^oppo/OPPO/')
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          echo "处理 FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV

          # 动态调用源码清单仓库，仓库优先级：1️⃣ OnePlusOSS → 2️⃣ Dynamic → 3️⃣ Appendix
          DYNAMIC_REPO_INPUT="vring99"
          declare -A REPOS
          REPOS["OnePlusOSS"]="OnePlusOSS|kernel_manifest"
          REPOS["Dynamic"]="${DYNAMIC_REPO_INPUT}|kernel_manifest_oplus"
          REPOS["Appendix"]="Numbersf|kernel_manifest"

          FOUND_REPO=""
          FOUND_BRANCH=""

          check_repo() {
            local ENTRY=$1
            local OWNER=${ENTRY%%|*}
            local REPO_NAME=${ENTRY##*|}
            local API_URL="https://api.github.com/repos/${OWNER}/${REPO_NAME}"

            echo "🌐 尝试拉取 ${OWNER}/${REPO_NAME} 分支列表..."
            BRANCHES=$(git ls-remote --heads https://github.com/${OWNER}/${REPO_NAME}.git | sed 's|.*refs/heads/||')

            if [[ -z "$BRANCHES" ]]; then
              echo "⚠️ ${OWNER}/${REPO_NAME} 分支列表获取失败，请尝试重新运行工作流。"
              return 1
            fi
            for BRANCH in $BRANCHES; do
              XML_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/${FILE}.xml"
              README_URL="https://raw.githubusercontent.com/${OWNER}/${REPO_NAME}/${BRANCH}/README.md"

              if curl -sf --head "$XML_URL" >/dev/null; then
                echo "✅ 在 ${OWNER}/${REPO_NAME} 找到 ${FILE}.xml(分支: ${BRANCH})"
                curl -s -o "$XML_PATH" "$XML_URL"
                curl -s -o "$README_PATH" "$README_URL" || true

                FOUND_REPO="$OWNER"
                FOUND_REPO_NAME="$REPO_NAME"
                FOUND_BRANCH="$BRANCH"

                return 0
              fi
            done
            return 1
          }
          if ! check_repo "${REPOS["OnePlusOSS"]}"; then
            if ! check_repo "${REPOS["Dynamic"]}"; then
              check_repo "${REPOS["Appendix"]}"
            fi
          fi
          if [[ -z "$FOUND_REPO" || ! -s "$XML_PATH" ]]; then
            echo "❌ 无法在任何仓库中找到 ${FILE}.xml"
            exit 9
          fi
          echo "MANIFEST_REPO=$FOUND_REPO" >> "$GITHUB_ENV"
          echo "MANIFEST_REPO_NAME=$FOUND_REPO_NAME" >> "$GITHUB_ENV"
          echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> "$GITHUB_ENV"

          # 解析 revision 字符串
          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | head -n1 || true)
          echo "解析 FILE 获取 CPU 和 ANDROID_VERSION..."
          # 提取 CPU
          CPU=$(echo "$REVISION" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          # 提取 ANDROID_VERSION
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d{1,2}\.\d{1,2}(\.\d{1,2})?')
          if [[ -n "$CPU" && -n "$ANDROID_VERSION" ]]; then
            echo "✅ CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION"
            echo "CPU=$CPU" >> $GITHUB_ENV
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
            # 获取短位 Android 版本号
            echo "ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}" >> $GITHUB_ENV
          else
            echo "❌ 无法从 revision 中提取 CPU 或 ANDROID_VERSION"
            exit 1
          fi

          echo "解析 README.md 获取 CPUD 和 BUILD_METHOD..."
          if [[ -s "$README_PATH" ]]; then
            BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
            if [[ -n "$BUILD_LINE" ]]; then
              CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
              BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
              echo "✅ CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
            else
              echo "❌ README.md 中未找到构建命令"
            fi
          else
            echo "❌ README.md 下载失败或为空"
          fi

          # 传递组合信息
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Debug Show Selected Inputs
        run: |
          echo "-----------------------"
          echo "Selected CPU: ${{ env.CPU }}"
          echo "Selected CPUD: ${{ env.CPUD }}"
          echo "Selected ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "Selected BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "Selected FILE: ${{ inputs.FILE }}"
          echo "Custom KSU_META: ${{ inputs.KSU_META }}"
          echo "Custom BUILD_TIME: ${{ inputs.BUILD_TIME }}"
          echo -n "BUILD_TIME Unicode: "
          python3 -c "print(''.join(f'U+{ord(c):04X} ' for c in '''${{ inputs.BUILD_TIME }}'''))"
          echo "Custom SUFFIX: ${{ inputs.SUFFIX }}"
          echo -n "SUFFIX Unicode: "
          python3 -c "print(''.join(f'U+{ord(c):04X} ' for c in '''${{ inputs.SUFFIX }}'''))"
          echo "Selected SUSFS_CI: ${{ inputs.SUSFS_CI }}"
          echo "Selected HOOK: ${{ inputs.HOOK }}"
          echo "Selected LSM: ${{ inputs.LSM }}"
          echo "Selected FAST_BUILD: ${{ inputs.FAST_BUILD }}"
          echo "Selected SCHED: ${{ inputs.SCHED }}"
          echo "Selected ZRAM: ${{ inputs.ZRAM }}"
          echo "Selected KPM: ${{ inputs.KPM }}"
          echo "-----------------------"

      - name: Check Disk Space
        run: df -h

      - name: Create and Enable 3G Swap
        run: |
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Set Cache Environment
        run: |
          echo "CCACHE_DIR=$HOME/.ccache_${{ inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ inputs.FILE }}"
          echo "set: $HOME/.ccache_${{ inputs.FILE }}"

      - name: Configure Git
        run: |
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"


      - name: Install Dependencies + APTC
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix kmod libdw-dev elfutils
          execute_install_scripts: true


      - name: Set APT Cache
        uses: actions/cache@v5
        with:
          path: ${{ env.HOME }}/apt-cache
          key: ${{ runner.os }}-apt-${{ hashFiles('.github/workflows/build-kernel.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - name: Install Dependencies
        run: |
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock
          APT_CACHE_DIR="$HOME/apt-cache"
          mkdir -p "$APT_CACHE_DIR/lists/partial"
          sudo apt -o Dir::Cache="$APT_CACHE_DIR" update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt -o Dir::Cache="$APT_CACHE_DIR" install -yq --no-install-recommends \
            python3 git curl ccache libelf-dev \
            build-essential flex bison libssl-dev \
            libncurses-dev liblz4-tool zlib1g-dev \
            libxml2-utils rsync unzip

      - name: Restore Ccache
        uses: actions/cache@v3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-15

      - name: Initialize Ccache
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              echo "初始化 ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
              echo "✅ ccache 初始化完成"
            else
              echo "✅ ccache 已初始化，跳过"
            fi
          else
            echo "❌ 未安装 ccache，跳过"
          fi
          ccache -s

      - name: Install Repo Tool
        run: |
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo

      - name: Initialize Repo and Sync
        env:
          FILE: ${{ inputs.FILE }}
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"
          BASE_URL="https://github.com/${MANIFEST_REPO}/${MANIFEST_REPO_NAME}.git"
          
          echo "使用$MANIFEST_REPO/$MANIFEST_REPO_NAME($MANIFEST_BRANCH)初始化仓库..."
          repo init -u "$BASE_URL" -b "$MANIFEST_BRANCH" -m "${FILE}.xml" --depth=1 --no-clone-bundle --no-tags
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync
          
          KERNEL_REPOS=""
          KERNEL_REPOS_PATH=$(find . -type f -name "build.config.msm.common" | head -n 1)
          if [[ -n "$KERNEL_REPOS_PATH" ]]; then
            KERNEL_REPOS=$(echo "${KERNEL_REPOS_PATH#./}" | cut -d/ -f2)
            echo "✅ 发现 build.config.msm.common: $KERNEL_REPOS_PATH"
            echo "✅ KERNEL_REPOS=$KERNEL_REPOS"
            echo "KERNEL_REPOS=$KERNEL_REPOS" >> "$GITHUB_ENV"
          else
            echo "❎ 未找到 build.config.msm.common，可能是天玑清单或纯 Kleaf 构建结构"
          fi
          
          for dir in kernel_platform/common kernel_platform/$KERNEL_REPOS; do
            if [ -e "$dir/BUILD.bazel" ]; then
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            fi
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || echo "No protected exports in $dir"
          done

      - name: Kernel Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 获取内核 Android 版本号(KANDROID_VERSION)以及内核版本号(KERNEL_VERSION)
          for f in ./common/build.config.constants ./common/build.config.common; do
            if [ -f "$f" ]; then
              BRANCH=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$BRANCH" ] && break
            fi
          done
          if [[ -z "$BRANCH" && -n "$KERNEL_REPOS" ]]; then
            BRANCH=$(sed -n '2p' "./$KERNEL_REPOS/android/ACK_SHA" | awk -F'-' '{print $1"-"$2}')
          fi
          if [ -n "$BRANCH" ]; then
            echo "KANDROID_VERSION=${BRANCH%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${BRANCH#*-}" >> $GITHUB_ENV
          else
            echo "No BRANCH found in build.config* and ACK_SHA files"
          fi
          
          # 从 Makefile 获取完整内核版本号(TKERNEL_VERSION)以及可选的修改内核等级
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          
          # 强制修改 SUBLEVEL(内核等级)
          SUBLEVEL_INPUT="${{ github.event.inputs.SUBLEVEL }}"
          if [ -n "$SUBLEVEL_INPUT" ]; then
            echo "修改 SUBLEVEL 为 $SUBLEVEL_INPUT"
            sed -i "s/^\(SUBLEVEL[[:space:]]*=[[:space:]]*\).*/\1$SUBLEVEL_INPUT/" ./common/Makefile
          else
            echo "未指定 SUBLEVEL，保持默认"
          fi
          
          # 读取修改后的版本
          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          
          if [ "$ORIG_VERSION" != "$NEW_VERSION" ]; then
            echo "Kernel Version:$ORIG_VERSION->$NEW_VERSION"
            echo "TKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          else
            echo "Kernel Version:$ORIG_VERSION No changes"
            echo "TKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          fi
          
          # 内核版本的数字转换(对比用)
          echo "KV1=${BRANCH#*-}"       | cut -d. -f1 >> $GITHUB_ENV
          echo "KV2=${BRANCH#*-}"       | tr -d '.' >> $GITHUB_ENV
          echo "KV3=${NEW_VERSION}"     | tr -d '.' >> $GITHUB_ENV

      - name: Rust Version Handling
        run: |
          cd kernel_workspace/kernel_platform
          # 从 build.config.constants 读取 RUSTC_VERSION
          RUSTC_VERSION=""
          if [[ -f ./common/build.config.constants ]]; then
            RUSTC_VERSION=$(grep '^RUSTC_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
          fi
          if [[ -n "$RUSTC_VERSION" ]]; then
            echo "✅ RUSTC_VERSION=$RUSTC_VERSION"
            echo "RUSTC_VERSION=$RUSTC_VERSION" >> $GITHUB_ENV
            echo "ENABLE_RUST=true" >> $GITHUB_ENV
          else
            echo "✅ RUSTC_VERSION 未找到，Rust 编译已禁用"
            echo "ENABLE_RUST=false" >> $GITHUB_ENV
          fi

      # 自定义内核后缀
      - name: Custom Kernel Suffix if set
        if: ${{ inputs.SUFFIX != '' }}
        run: |
          cd kernel_workspace
          SUFFIX="${{ inputs.SUFFIX }}"
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          FAST_BUILD="${{ inputs.FAST_BUILD }}"
          if [ "$KERNEL_VERSION" = "6.12" ]; then
            GIT_PART=$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')
            AB_PART=$(printf "%08d" $(( $(od -An -N4 -tu4 /dev/urandom) % 100000000 )))
            VERSION_SUFFIX="5-g${GIT_PART}-ab${AB_PART}-4k"
          else
            VERSION_SUFFIX="$SUFFIX"
          fi
          
          for path in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/$KERNEL_REPOS/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do
          
            [ -f "$path" ] || continue
          
            echo "Modifying: $path"
          
            # Remove -dirty
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"
          
            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${VERSION_SUFFIX}\"|" "$path"
          
            elif grep -q 'echo "\$res"' "$path"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${VERSION_SUFFIX}\"/" "$path"
              else
                echo "Standard build: injecting suffix via cut/echo"
                if [[ -f ./kernel_platform/build_with_bazel.py ]]; then
                  echo "使用官方脚本编译且当使用 build_with_bazel 时，可能受特殊符号数量限制，编译失败请修改"
                  echo "When using the official script and building with build_with_bazel, the build may fail due to a limit on the number of special characters. Please modify the configuration if that happens."
                fi
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${VERSION_SUFFIX}\"" >> "$path"
            fi
          
            chmod +x "$path"
          done
          

      # 伪官方格式的随机后缀（仅在 SUFFIX 未设置时生效）*
      - name: Custom Kernel Random Suffix if empty
        if: ${{ inputs.SUFFIX == '' }}
        run: |
          cd kernel_workspace
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          FAST_BUILD="${{ inputs.FAST_BUILD }}"
          
          # 生成随机数字和随机hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-o-g${RANDOM_HASH}"
          if [ "$KERNEL_VERSION" = "6.12" ]; then
            GIT_PART=$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')
            AB_PART=$(printf "%08d" $(( $(od -An -N4 -tu4 /dev/urandom) % 100000000 )))
            RANDOM_SUFFIX="5-g${GIT_PART}-ab${AB_PART}-4k"
          fi
          
          # Remove -dirty
          sed -i 's/ -dirty//g' "$path"
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"
          
          for path in \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/$KERNEL_REPOS/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; do
          
            [ -f "$path" ] || continue
          
            echo "Modifying: $path"
          
          
            if grep -q 'KERNELVERSION.*scm_version' "$path"; then
              echo "Detected NEW setlocalversion format"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$path"
          
            elif grep -q 'echo "\$res"' "$path"; then
              echo "Detected OLD setlocalversion format"
              if [ "$FAST_BUILD" = "true" ]; then
                echo "FAST_BUILD enabled: using static res with random suffix"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$path"
              else
                echo "Standard build: injecting random suffix via cut/echo"
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              fi
            else
              echo "Unknown format, appending echo manually"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$path"
            fi
          
            chmod +x "$path"
          done
          

      - name: Add SukiSU Ultra
        run: |
          cd kernel_workspace/kernel_platform
          
          echo "正在配置ReSukiSU..."
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/refs/heads/main/kernel/setup.sh" | bash -s main
          echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@vring"' >> ./common/arch/arm64/configs/gki_defconfig
          cd ./KernelSU
          # 生成自定义版本号（基于提交计数）, 失败时使用 114514
          KSU_VERSION=$(expr $(git rev-list --count main) + 30700 2>/dev/null || echo 114514)
          # 存储版本号到 GitHub 环境变量
          echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
          echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT

      - name: Apply Patches SukiSU Ultra
        run: |
          cd kernel_workspace
          
          SUSFS_BRANCH="gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}
          
          cd susfs4ksu
          if [ "$SUSFS_BRANCH" = "gki-android12-5.10" ]; then
            git checkout 86114db0
          
           elif [ "$SUSFS_BRANCH" = "gki-android13-5.15" ]; then
            git checkout e4bd49f7
          elif [ "$SUSFS_BRANCH" = "gki-android14-6.1" ]; then
            git checkout 9bf72ec2
          elif [ "$SUSFS_BRANCH" = "gki-android15-6.6" ]; then
            git checkout 2df41de7
          elif [ "$SUSFS_BRANCH" = "gki-android16-6.12" ]; then
            git checkout 75a61385
          else
            echo "No specific commit for this"
            exit 500
          fi
          cd ../
          
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          git clone https://github.com/Numbersf/Action-Build.git
          cd kernel_platform
          echo "正在拉取susfs补丁"
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch ./common/
          cp ../susfs4ksu/kernel_patches/fs/* ./common/fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* ./common/include/linux/
          
          if [ "${{ inputs.ZRAM }}" = "true" ]; then
            echo "正在拉取zram补丁"
            cp -r ../SukiSU_patch/other/zram/lz4k/include/linux/* ./common/include/linux/
            cp -r ../SukiSU_patch/other/zram/lz4k/lib/* ./common/lib/
            cp -r ../SukiSU_patch/other/zram/lz4k/crypto/* ./common/crypto/
            cp -r ../SukiSU_patch/other/zram/lz4k_oplus ./common/lib/
          fi
          
          cd ./common
          GKI_V="${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}"
          SUBLEVEL=$(grep '^SUBLEVEL *=' Makefile | head -n1 | cut -d= -f2 | tr -d ' ')
          
          if [ "$GKI_V" == "android13-5.15" ] && [ "$SUBLEVEL" -lt 123 ]; then
            echo "修复内核版本为5.15.0~5.15.123仅支持旧版C库造成的一些bug"
            cp ../../Action-Build/patches/fix_5.15.legacy ./fix_5.15.legacy.patch
            patch -p1 < fix_5.15.legacy.patch
            echo "fix_5.15_patch完成"
          fi
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          TKERNEL_VERSION="${{ env.TKERNEL_VERSION }}"
          file="${{ inputs.FILE }}"
          TRUSTY_EXISTS="false"
          if [[ "$KERNEL_VERSION" == "6.6" ]]; then
            if grep -q 'common-modules/trusty' "$GITHUB_WORKSPACE/.repo/manifests_fallback/${file}.xml"; then
              TRUSTY_EXISTS="true"
            fi
            echo "trusty_exists=$TRUSTY_EXISTS" >> $GITHUB_OUTPUT
          
            if [[ "$TRUSTY_EXISTS" == "false" && "$(printf '%s\n' "$TKERNEL_VERSION" "6.6.30" | sort -V | head -n1)" = "$TKERNEL_VERSION" ]]; then
              echo "修复内核版本6.6部分机型缺失Trusty OS导致的susfs的报错"
              sed -i 's/-32,12 +32,38/-32,11 +32,37/g' 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${KERNEL_VERSION}.patch
              sed -i '/#include <trace\/hooks\/fs.h>/d' 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${KERNEL_VERSION}.patch
            fi
          fi
          # Fake Patch to fix failures
          fake_patched=0
          if [ "$GKI_V" = "android15-6.6" ]; then
            if ! grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
              echo "未找到 nr_subpages,正在进行补丁修复"
              sed -i -e '/int ret = 0, copied = 0;/a \\tunsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;' -e '/int ret = 0, copied = 0;/a \\tpagemap_entry_t \*res = NULL;' ./fs/proc/task_mmu.c
              fake_patched=1
            fi
          fi
          if [ "$GKI_V" = "android12-5.10" ] || [ "$GKI_V" = "android13-5.15" ]; then
            if ! grep -qxF $'\tif (!vma_pages(vma))' ./fs/proc/task_mmu.c; then
              echo "未找到 vma_pages,正在进行补丁修复"
              fake_patched=1
            fi
          fi
          
          echo "正在打susfs补丁"
          patch -p1 < 50_add_susfs_in_gki-${{ env.KANDROID_VERSION }}-${{ env.KERNEL_VERSION }}.patch || true
          echo "susfs_patch完成"
          
          # Revert
          if [ "$fake_patched" = 1 ]; then
            if [ "$GKI_V" = "android15-6.6" ]; then
              if grep -qxF $'\tunsigned int nr_subpages = __PAGE_SIZE / PAGE_SIZE;' ./fs/proc/task_mmu.c; then
                sed -i -e '/unsigned int nr_subpages \= __PAGE_SIZE \/ PAGE_SIZE;/d' -e '/pagemap_entry_t \*res = NULL;/d' ./fs/proc/task_mmu.c
              fi
            fi
            if [ "$GKI_V" = "android12-5.10" ] || [ "$GKI_V" = "android13-5.15" ]; then
              if grep -qxF $'\t\tgoto show_pad;' ./fs/proc/task_mmu.c; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
            fi
          fi
          
          CURRENT_SUB="$SUBLEVEL"
          if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
            CURRENT_SUB=99999
          fi
          echo "应用 SUSFS 补丁..."
          SUSFS_VERSION="2.1.0"
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          git clone https://github.com/WildKernels/kernel_patches.git "$KERNEL_PATCHES"
          
          if [[ "$GKI_V" == "android12-5.10" ]]; then
              if [[ "$CURRENT_SUB" -le 209 ]]; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
              if [[ "$CURRENT_SUB" -le 117 ]]; then
                cp $KERNEL_PATCHES/wild/archived/susfs_fix_patches/v${SUSFS_VERSION}/a12-5.10/fdinfo.c.patch ./
                patch -p1 < fdinfo.c.patch || true
              fi
              if [[ "$CURRENT_SUB" -le 43 ]]; then
                cp $KERNEL_PATCHES/wild/archived/susfs_fix_patches/v${SUSFS_VERSION}/a12-5.10/base.c.patch ./
                patch -p1 < base.c.patch || true
              fi
          fi
          if [[ "$GKI_V" == "android13-5.15" ]]; then 
            #if [[ "$CURRENT_SUB" -gt 167 ]]; then
              # memory.c
          
              echo "===== 检查 ====="
              grep -n "SUSFS_IS_INODE_SUS_MAP" mm/memory.c
              grep -R "define SUSFS_IS_INODE_SUS_MAP" -n include fs mm kernel 2>/dev/null
              grep -n "susfs_def.h" mm/memory.c || echo "memory.c 缺少 susfs_def.h"
          
              echo "===== 修复 ====="
             if grep -q "SUSFS_IS_INODE_SUS_MAP" mm/memory.c && ! grep -q "susfs_def.h" mm/memory.c; then
                  sed -i '/#include <linux\/vmalloc.h>/a \
                  #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux/susfs_def.h>\n#endif' mm/memory.c
              fi
          
              echo "===== 验证 ====="
              grep -n "susfs_def.h\|SUSFS_IS_INODE_SUS_MAP" mm/memory.c
          
          
            #fi
          fi
          
          
          # Android 14 - 6.1 修复
          if [[ "$GKI_V" == "android14-6.1" ]]; then
            if [[ "$CURRENT_SUB" -le 141 || "$CURRENT_SUB" -ge 145 ]]; then
              cp $KERNEL_PATCHES/wild/archived/susfs_fix_patches/v${SUSFS_VERSION}/a14-6.1/base.c.patch ./
              patch -p1 < base.c.patch || true
            fi
            if ! grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
              sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
            fi
            if grep -q 'susfs_is_current_proc_umounted' ./fs/proc/base.c && ! grep -qF '#include <linux/susfs.h>' ./fs/proc/base.c; then
              sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs.h>' ./fs/proc/base.c
            fi
            if [[ "$CURRENT_SUB" -le 128 ]]; then
              sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
            fi
          fi
          
          # Android 15 - 6.6 修复
          if [[ "$GKI_V" == "android15-6.6" ]]; then
            if [[ "$CURRENT_SUB" -ge 98 ]]; then
              cp $KERNEL_PATCHES/wild/archived/susfs_fix_patches/v${SUSFS_VERSION}/a15-6.6/base.c.patch ./
              patch -p1 < base.c.patch || true
            fi
            # 修复 6.6.50~6.6.97: 缺少 susfs_def.h 导致编译报 undeclared identifier
            if grep -q 'AS_FLAGS_SUS_MAP\|susfs_is_current_proc_umounted' ./fs/proc/base.c && ! grep -qF 'susfs_def.h' ./fs/proc/base.c; then
              if ! grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
              sed -i '/#include <linux\/dma-buf.h>/a #endif' ./fs/proc/base.c
              sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs_def.h>' ./fs/proc/base.c
              sed -i '/#include <linux\/dma-buf.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP' ./fs/proc/base.c
            fi
            # 修复 ReSukiSU: 缺少 susfs.h 导致编译报 undeclared identifier
            if grep -q 'SUSFS_IS_INODE_SUS_MAP\|SUSFS_IS_INODE_OPEN_REDIRECT' ./fs/proc/base.c && ! grep -qF '#include <linux/susfs.h>' ./fs/proc/base.c; then
              if ! grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              fi
              sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs.h>' ./fs/proc/base.c
            fi
          
          
          
            if [[ "$CURRENT_SUB" -le 58 ]]; then
              # memory.c
              sed -i '/#include <linux\/sched\/sysctl.h>/a \
              #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux/susfs_def.h>\n#endif' mm/memory.c
              # fs/proc/base.c
              sed -i '/#include <linux\/dma-buf.h>/a \
              #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif' fs/proc/base.c
          
            fi
          fi

      # OGKI转换GKI，无需修改 dtbo 开机
      - name: Apply Convert HMBIRD_OGKI to HMBIRD_GKI
        if: ${{ fromJSON(env.KV1) >= 6 && fromJSON(env.KV2) >= 66 && github.event.inputs.SCHED == 'false' }}
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "源码中风驰代码已经存在，启用二次回退"
              exit 0
            }
          done
          sed -i '1iobj-y += hmbird_patch.o' drivers/Makefile
          echo "正在打OGKI转换GKI补丁"
          patch -p1 -F 3 < "${PATCH_DIR}/hmbird_patch.patch" || true
          echo "OGKI转换GKI_patch完成"



      - name: Apply ZRAM
        if: ${{ inputs.ZRAM }}
        run: |
          cd kernel_workspace/kernel_platform/common
          cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4kd.patch ./
          echo "正在打lz4kd补丁"
          patch -p1 -F 3 < lz4kd.patch || true
          echo 'lz4kd_patch完成'
          cp ../../SukiSU_patch/other/zram/zram_patch/${{ env.KERNEL_VERSION }}/lz4k_oplus.patch ./
          echo "正在打lz4k_oplus补丁"
          patch -p1 -F 3 < lz4k_oplus.patch || true
          echo 'lz4k_oplus_patch完成'

      - name: Apply SCHED
        env:
          FILE: ${{ inputs.FILE }}
        if: ${{ inputs.SCHED }}
        run: |
          cd kernel_workspace/kernel_platform/common
          for p in ./kernel/sched/hmbird* ./vendor/oplus/kernel/cpu/sched_ext/hmbird*; do
            [ -d "$p" ] && {
              echo "源码中风驰代码已经存在，启用二次回退"
              exit 0
            }
          done
          git clone https://github.com/Numbersf/SCHED_PATCH.git -b $CPU || { echo "❌ CPU 分支不存在，风驰内核暂未支持你的机型，请关闭后重试"; exit 11; }
          echo "正在拉取风驰补丁"
          
          
          if [ "$FILE" == "oneplus_ace5_ultra_b_vring" ]; then   
              FILE="oneplus_ace_6"
          fi
           cp ./SCHED_PATCH/fengchi_${FILE}.patch ./
          if [[ -f "fengchi_${FILE}.patch" ]]; then
            echo "正在打风驰补丁"
            dos2unix "fengchi_${FILE}.patch"
            patch -p1 -F 3 < "fengchi_${FILE}.patch" || true
            echo "fengchi_patch完成"
          else
            echo "❌ 未匹配到补丁，风驰内核暂未支持你的机型，请关闭后重试"
            exit 12
          fi

      - name: Apply UNICODE_BYPASS and MEMORY_OPT
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          if [ "$KV1" -lt 6 ]; then
            echo "Patching unicode!"
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "${PATCH_DIR}/unicode_bypass_fix_6.1+.patch" || true
          fi
      #- name: 应用 SELinux 策略/上下文查询隐藏补丁
      #  run: |
      #    cd kernel_workspace/kernel_platform/common
      #    echo "正在应用 SELinux 策略/上下文查询隐藏补丁..."
      #    wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/70_selinux_hide_policy_query.patch -O 70_selinux_hide_policy_query.patch
      #    patch -p1 -N -F 3 < 70_selinux_hide_policy_query.patch || true

      - name: Apply LSM_BBG
        if: ${{ inputs.LSM }}
        run: |
          cd kernel_workspace/kernel_platform/common
          echo "正在启用内核级基带保护支持…"
          curl -LSs https://raw.githubusercontent.com/vc-teahouse/Baseband-guard/main/setup.sh | bash
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' ./security/Kconfig

      # 配置信息,带*为附加项目,具有一定危险性和不确定性
      - name: Add Configuration Settings
        run: |
          cd kernel_workspace/kernel_platform/common
          CONFIG_FILE=./arch/arm64/configs/gki_defconfig
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          
          # SukiSU Ultra配置
          echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
          
          # KPM配置
          echo "CONFIG_KPM=y" >> "$CONFIG_FILE"
          
          # HOOK配置
          
          
          # SUSFS配置
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

          # TMPFS配置*
          echo "CONFIG_TMPFS_XATTR=y" >> "$CONFIG_FILE"
          echo "CONFIG_TMPFS_POSIX_ACL=y" >> "$CONFIG_FILE"
          #echo "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" >> "$CONFIG_FILE"
          #echo "CONFIG_HEADERS_INSTALL=n" >> "$CONFIG_FILE"
          
          # BBR配置*
          echo "CONFIG_TCP_CONG_ADVANCED=y" >> "$CONFIG_FILE" 
          echo "CONFIG_TCP_CONG_BBR=y" >> "$CONFIG_FILE"
          echo "CONFIG_NET_SCH_FQ=y" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_BIC=n" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_WESTWOOD=n" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_CONG_HTCP=n" >> "$CONFIG_FILE"
          
          # ECN配置*
          echo "CONFIG_IP_ECN=y" >> "$CONFIG_FILE"
          echo "CONFIG_TCP_ECN=y" >> "$CONFIG_FILE"
          echo "CONFIG_IPV6_ECN=y" >> "$CONFIG_FILE"
          echo "CONFIG_IP_NF_TARGET_ECN=y" >> "$CONFIG_FILE"
          
          # ZRAM配置*
          if [ "${{ inputs.ZRAM }}" = "true" ]; then
            echo "CONFIG_CRYPTO_LZ4HC=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4K=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4KD=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_842=y" >> "$CONFIG_FILE"
            echo "CONFIG_CRYPTO_LZ4K_OPLUS=y" >> "$CONFIG_FILE"
            echo "CONFIG_ZRAM_WRITEBACK=y" >> "$CONFIG_FILE"
          fi
          
          # LSM配置*
          if [ "${{ inputs.LSM }}" = "true" ]; then
            echo "CONFIG_BBG=y" >> "$CONFIG_FILE"
          fi
          IPV6="${{ inputs.IPV6 }}"
          # IPSET & IPv6_NAT配置*
          if [[ "${CPU}" == sm*  && "${IPV6}" = "true" ]]; then
            if [[ "$KERNEL_VERSION" != "6.12" ]]; then
              echo "CONFIG_BPF_STREAM_PARSER=y" >> "$CONFIG_FILE"
            fi
            echo "CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y" >> "$CONFIG_FILE"
            echo "CONFIG_NETFILTER_XT_SET=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_MAX=65534" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_BITMAP_IP=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_BITMAP_IPMAC=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_BITMAP_PORT=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_IP=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_IPMARK=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_IPPORT=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_IPPORTIP=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_IPPORTNET=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_IPMAC=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_MAC=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_NETPORTNET=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_NET=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_NETNET=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_NETPORT=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_HASH_NETIFACE=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP_SET_LIST_SET=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP6_NF_NAT=y" >> "$CONFIG_FILE"
            echo "CONFIG_IP6_NF_TARGET_MASQUERADE=y" >> "$CONFIG_FILE"
          fi
          
          # 修复构建问题
          # MTK 6.1: keep the verified bootable BTF setting; do not force DEBUG_INFO_BTF=n.
          if [[ "$ENABLE_RUST" == "true" ]]; then
            echo "CONFIG_RUST=y" >> "$CONFIG_FILE"
            echo "CONFIG_ANDROID_BINDER_IPC_RUST=m" >> "$CONFIG_FILE"
          fi
          
          # 移除构建审查
          sed -i 's/check_defconfig//' ./build.config.gki

      - name: Fix IPv6_NAT Error
        run: |
          PATCH_DIR="${GITHUB_WORKSPACE}/kernel_workspace/Action-Build/patches"
          cd kernel_workspace/kernel_platform/common
          # IPSET & IPv6_NAT配置*
          IPV6="${{ inputs.IPV6 }}"
          if [[ "${CPU}" == sm*  && "${IPV6}" = "true" ]]; then
            echo "修复启用IPv6 NAT后可能出现的设备误报…"
            patch -p1 -F 3 < "${PATCH_DIR}/IPv6_NAT_FIX.patch"
          else
            echo "你的设备不支持 IPv6 NAT，跳过此步骤。"
          fi

      # Custom kernel build time, without adding #1 SMP PREEMPT 自定义内核构建时间，不要加入#1 SMP PREEMPT
      - name: Custom BUILD_TIME
        shell: bash
        run: |
          INPUT_TIME="${{ inputs.BUILD_TIME }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "F" && "$INPUT_TIME" != "f" ]]; then
            DATESTR="$INPUT_TIME"
            echo "Using input BUILD_TIME: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "Using UTC time as fallback: $DATESTR"
          fi
          echo "KBUILD_BUILD_TIMESTAMP=${DATESTR}" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"
          cd kernel_workspace/kernel_platform/
          for f in common/scripts/mkcompile_h $KERNEL_REPOS/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done

      - name: Disable GPUEB
        if: ${{ env.KERNEL_VERSION == '5.10' && startsWith(env.CPU, 'mt') }}
        run: |
          echo "Disabling GPUEB for MTK kernel 5.10"
          sed -i '/obj-y.*gpueb/d' kernel_workspace/kernel-5.10/drivers/gpu/mediatek/Makefile

      - name: Build Kernel Repo Toolchain Make
        if: ${{ inputs.FAST_BUILD }}
        id: fast_build
        run: |
          KERNEL_VERSION="${{ env.KERNEL_VERSION }}"
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"

          cd kernel_workspace/kernel_platform

          REPO_CLANG_PREBUILT_BIN=""
          for f in ./common/build.config.common ./"$KERNEL_REPOS"/build.config.common; do
            [[ -f "$f" ]] || continue
            REPO_CLANG_PREBUILT_BIN=$(grep '^CLANG_PREBUILT_BIN=' "$f" | cut -d'=' -f2)
            [[ -n "$REPO_CLANG_PREBUILT_BIN" ]] && break
          done
          if [[ -z "$REPO_CLANG_PREBUILT_BIN" ]]; then
            echo "::error::CLANG_PREBUILT_BIN 未在 build.config.common 中找到"
            exit 1
          fi

          if [[ "$REPO_CLANG_PREBUILT_BIN" =~ (clang-r[0-9a-z]+) ]]; then
            REPO_CLANG_VERSION="${BASH_REMATCH[1]}"
          elif [[ -f ./common/build.config.constants ]]; then
            REPO_CLANG_VERSION=$(grep '^CLANG_VERSION=' ./common/build.config.constants | cut -d'=' -f2 || true)
          fi
          if [[ -n "$REPO_CLANG_VERSION" ]]; then
            REPO_CLANG_PREBUILT_BIN=${REPO_CLANG_PREBUILT_BIN/\$\{CLANG_VERSION\}/$REPO_CLANG_VERSION}
          fi

          CLANG_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$REPO_CLANG_PREBUILT_BIN"
          CLANG_LIB="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/$(dirname "$REPO_CLANG_PREBUILT_BIN")/lib"
          RUST_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/rust/linux-x86/${{ env.RUSTC_VERSION }}/bin"
          BUILD_TOOLS_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/kernel-build-tools/linux-x86/bin"
          BINDGEN_DIR=""
          BINDGEN_BIN="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang-tools/linux-x86/bin/bindgen"
          if [[ -x "$BINDGEN_BIN" ]]; then
            BINDGEN_DIR=$(dirname "$BINDGEN_BIN")
          fi

          cd common
          SETUP_ENV_BRANCH="android16-6.12-2025-06"
          if curl -fsSL "https://raw.githubusercontent.com/cctv18/android_gki_kernel_common/refs/heads/${SETUP_ENV_BRANCH}/_setup_env.sh" -o ./_setup_env.sh; then
            source "./_setup_env.sh" || true
          else
            echo "未找到 ${SETUP_ENV_BRANCH}/_setup_env.sh，继续使用当前源码环境"
          fi
          unset CLANG_PREBUILT_BIN CLANG_VERSION

          if [[ "${{ env.ENABLE_RUST }}" == "true" ]]; then
            export PATH="$CLANG_BIN:$BUILD_TOOLS_BIN:$RUST_BIN${BINDGEN_DIR:+:$BINDGEN_DIR}:$PATH"
          else
            export PATH="$CLANG_BIN:$BUILD_TOOLS_BIN${BINDGEN_DIR:+:$BINDGEN_DIR}:$PATH"
          fi
          export LLVM=1 LLVM_IAS=1
          export ARCH=arm64 SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="clang"
          export HOSTCC="clang"
          export LD="ld.lld"
          export HOSTLD="ld.lld"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export AS="clang"
          export READELF="llvm-readelf"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export OBJSIZE="llvm-size"
          export STRIP="llvm-strip"
          export PAHOLE="$BUILD_TOOLS_BIN/pahole"
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_NOHASHDIR="true"
          export CCACHE_NOHARDLINK="true"
          export CCACHE_COMPILERCHECK="none"

          if [[ "${{ env.ENABLE_RUST }}" == "true" ]]; then
            export RUSTC="rustc"
          fi
          [ -x "$BINDGEN_BIN" ] && export BINDGEN="$BINDGEN_BIN"
          export LIBCLANG_PATH="$CLANG_LIB"

          echo "========== Repo Toolchain Make Debug =========="
          echo "FILE=${{ inputs.FILE }}"
          echo "CPU=${{ env.CPU }}"
          echo "CPUD=${{ env.CPUD }}"
          echo "BUILD_METHOD=${{ env.BUILD_METHOD }}"
          echo "KANDROID_VERSION=${KANDROID_VERSION}"
          echo "KERNEL_VERSION=${KERNEL_VERSION}"
          echo "TKERNEL_VERSION=${{ env.TKERNEL_VERSION }}"
          echo "RUSTC_VERSION=${{ env.RUSTC_VERSION }}"
          echo "SETUP_ENV_BRANCH=${SETUP_ENV_BRANCH}"
          echo "REPO_CLANG_PREBUILT_BIN=${REPO_CLANG_PREBUILT_BIN}"
          echo "REPO_CLANG_VERSION=${REPO_CLANG_VERSION}"
          echo "ENV_CLANG_PREBUILT_BIN=${CLANG_PREBUILT_BIN:-}"
          echo "CLANG_BIN=${CLANG_BIN}"
          echo "CLANG_LIB=${CLANG_LIB}"
          echo "RUST_BIN=${RUST_BIN}"
          echo "BUILD_TOOLS_BIN=${BUILD_TOOLS_BIN}"
          echo "BINDGEN_BIN=${BINDGEN_BIN}"
          echo "PATH_HEAD=$(echo "$PATH" | tr ':' '\n' | head -n 10 | paste -sd ':' -)"
          echo "which clang=$(command -v clang || true)"
          echo "which ld.lld=$(command -v ld.lld || true)"
          if [[ "${{ env.ENABLE_RUST }}" == "true" ]]; then
            echo "which rustc=$(command -v rustc || true)"
          fi
          echo "which bindgen=$(command -v bindgen || true)"
          echo "BINDGEN=${BINDGEN:-}"
          echo "PAHOLE=${PAHOLE}"
          clang --version | head -n 2 || true
          if [[ "${{ env.ENABLE_RUST }}" == "true" ]]; then
            rustc --version || true
          fi
          [ -x "$BINDGEN_BIN" ] && bindgen --version || true
          "$PAHOLE" --version || true
          echo "LLVM=${LLVM} LLVM_IAS=${LLVM_IAS} ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE}"
          echo "CC=${CC} HOSTCC=${HOSTCC} LD=${LD} HOSTLD=${HOSTLD}"
          echo "LIBCLANG_PATH=${LIBCLANG_PATH}"
          echo "================================================"

          COMMON_REAL_PATH=$(pwd -P)
          PLATFORM_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
          ROOT_REAL_PATH=$(dirname "$PLATFORM_REAL_PATH")
          KCFLAGS+=" -Wno-unused-command-line-argument"
          KCFLAGS+=" -Wno-error=unused-command-line-argument"
          KCFLAGS+=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -fmacro-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -ffile-prefix-map=$ROOT_REAL_PATH=."
          KCFLAGS+=" -no-canonical-prefixes"
          KCFLAGS+=" -O2"
          KCFLAGS+=" -pipe"
          KCFLAGS+=" -Wno-error"
          KCFLAGS+=" -fno-stack-protector"
          KCFLAGS+=" -D__ANDROID_COMMON_KERNEL__"
          export KCFLAGS

          make -j"$(nproc --all)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" HOSTCC="clang" LD="ld.lld" HOSTLD="ld.lld" OBJCOPY="llvm-objcopy" O=out gki_defconfig
          echo "========== Defconfig Debug =========="
          grep -E '^(CONFIG_LOCALVERSION|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_NONE|CONFIG_LTO_CLANG_THIN|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_RUST|CONFIG_KPM|CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_CFG80211|CONFIG_WLAN|CONFIG_BBG|CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE|CONFIG_HEADERS_INSTALL|CONFIG_DEBUG_INFO_BTF)=' out/.config || true
          echo "====================================="
          if [[ "$KERNEL_VERSION" == "5.10" || "$KERNEL_VERSION" == "5.15" ]]; then
            echo ">> 设置 LTO = thin"
            scripts/config --file out/.config -e LTO_CLANG
            scripts/config --file out/.config -e LTO_CLANG_THIN
            scripts/config --file out/.config -d LTO_CLANG_NONE
            scripts/config --file out/.config -d LTO_CLANG_FULL
          fi

          make -j"$(nproc --all)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" HOSTCC="clang" LD="ld.lld" HOSTLD="ld.lld" OBJCOPY="llvm-objcopy" O=out olddefconfig
          echo "========== Olddefconfig Debug =========="
          grep -E '^(CONFIG_LOCALVERSION|CONFIG_LTO_CLANG|CONFIG_LTO_CLANG_NONE|CONFIG_LTO_CLANG_THIN|CONFIG_MODULES|CONFIG_MODVERSIONS|CONFIG_RUST|CONFIG_KPM|CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_CFG80211|CONFIG_WLAN|CONFIG_BBG|CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE|CONFIG_HEADERS_INSTALL|CONFIG_DEBUG_INFO_BTF)=' out/.config || true
          echo "========================================"
          make -j"$(nproc --all)" LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" HOSTCC="clang" LD="ld.lld" HOSTLD="ld.lld" OBJCOPY="llvm-objcopy" O=out Image
          echo "========== Image Debug =========="
          ls -lh out/arch/arm64/boot/Image || true
          file out/arch/arm64/boot/Image || true
          sha256sum out/arch/arm64/boot/Image || true
          strings out/arch/arm64/boot/Image | grep -E 'Linux version|clang version|rustc version|SukiSU|KernelSU|susfs' | head -n 30 || true
          echo "================================="
          strings out/arch/arm64/boot/Image | grep 'Linux version'
          ccache -s

      - name: Stop on original make fallback
        if: ${{ !inputs.FAST_BUILD || steps.fast_build.outputs.fallback}}
        run: |
          echo "::error::original make debug flow does not fallback to Bazel/official script"
          exit 1

      - name: Make AnyKernel3
        run: |
          #git clone https://github.com/Numbersf/AnyKernel3 --depth=1
          git clone https://github.com/WildPlusKernel/AnyKernel3.git -b "gki-2.0"
          rm -rf ./AnyKernel3/.git
          mkdir -p kernel_workspace/kernel_platform/out/Final-Image-Find/
          dir1=""
          dir2=""
          image_path=$(find "./kernel_workspace/kernel_platform/common/out/" -name "Image" | head -n 1)
          if [ -n "$image_path" ]; then
            dir1=$(dirname "$image_path")/
            echo "使用 make 编译的统一路径，成功找到 Image 文件"
          else
            image_path=$(find "./kernel_workspace/kernel_platform/out/" -name "Image" | head -n 1)
            if [ -n "$image_path" ]; then
              dir2=$(dirname "$image_path")/
              echo "使用官方脚本编译，成功找到 Image 文件"
            else
              echo "未找到 Image 文件，构建失败" >&2
              exit 1
            fi
          fi
          if [ -n "$image_path" ] && [ -f "$image_path" ]; then
            echo "Image file finally located at: $image_path"
            cp "$image_path" ./AnyKernel3/Image
            cp "$image_path" kernel_workspace/kernel_platform/out/Final-Image-Find/Image
          fi
          if [ -n "$dir2" ] && [ "${{ env.CPU }}" = "sm8750" ] && [ "${{ inputs.FAST_BUILD }}" = "false" ]; then
            echo "当前正在使用官方脚本构建 sm8750，需额外复制一些其它镜像文件：dtbo.img、system_dlkm.img。请注意，如果你在刷完官方脚本构建后想换成极速构建，请还原这些分区！"
            echo "You are currently building sm8750 with the official script. Additional image files will be copied: dtbo.img, system_dlkm.img. Please note: If you switch to fast build after flashing this build, make sure to restore these partitions!"
            for file in dtbo.img system_dlkm.erofs.img; do
              if [ -f "$dir2$file" ]; then
                target_name="$file"
                if [ "$file" = "system_dlkm.erofs.img" ]; then
                  target_name="system_dlkm.img"
                fi
                cp "$dir2$file" "./AnyKernel3/$target_name"
              else
                echo "$file 不存在，跳过复制"
              fi
            done
          fi



      - name: Apply patch_linux and replace Image
        if: ${{ inputs.KPM }}
        run: |
          cd kernel_workspace/kernel_platform/out/Final-Image-Find
          #curl -LO --retry 5 --retry-delay 2 --retry-connrefused https://raw.githubusercontent.com/Numbersf/Action-Build/SukiSU-Ultra/patches/patch_linux
          curl -LO --retry 5 --retry-delay 2 --retry-connrefused https://github.com/SukiSU-Ultra/SukiSU_KernelPatch_patch/releases/latest/download/patch_linux
          chmod +x patch_linux
          ./patch_linux
          rm -f Image
          mv oImage Image
          cp Image $GITHUB_WORKSPACE/AnyKernel3/Image



      - name: Set zip Suffix
        id: suffix
        run: |
          echo "value=${{ inputs.LSM && '_LSM' || '' }}${{ inputs.SCHED && '_SCHED' || '' }}${{ inputs.KPM  && '_KPM' || '' }}" >> $GITHUB_OUTPUT
          echo "kpm=${{ ! inputs.KPM  && 'nkpm' || '' }}" >> $GITHUB_OUTPUT

      - name: Upload AnyKernel3
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KSUVER }}${{ steps.suffix.outputs.kpm }}-${{ steps.extract_info.outputs.value }}-${{ env.TKERNEL_VERSION }}${{ steps.suffix.outputs.value }}
          path: ./AnyKernel3/*

      - name: Download and Unzip ZRAM
        if: ${{ inputs.ZRAM}}
        id: zram_find
        run: |
          set -e
          sudo apt install -y unzip
          echo "尝试获取 ZRAM 模块 zip 下载链接..."
          retries=3
          success=0
          for i in $(seq 1 $retries); do
            echo "第 $i 次尝试下载..."
            download_url=$(curl -s https://api.github.com/repos/FurLC/ZRAM-Module/releases/latest | \
              grep "browser_download_url" | grep "ZRAM-Module-.*\.zip" | cut -d '"' -f 4 | head -n 1)
          
            if [ -n "$download_url" ]; then
              echo "✅ 成功获取下载链接: $download_url"
              wget -N "$download_url" && success=1 && break
            else
              echo "⚠️ 获取下载链接失败，等待 3 秒后重试..."
              sleep 3
            fi
          done
          
          if [ "$success" -ne 1 ]; then
            echo "❌ 连续 $retries 次尝试后仍然无法获取 ZRAM 模块下载链接"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          unzip "$(ls -t ZRAM-Module-*.zip | head -1)" -d ZRAM-Module
          target="./ZRAM-Module/zram/zram.ko"
          echo "查找 zram.ko 模块文件..."
          search_paths=(
            "./kernel_workspace/kernel_platform/out"
            "./kernel_workspace/device/qcom"
          )
          zram_path=""
          for path in "${search_paths[@]}"; do
            zram_path=$(find "$path" -type f -name "zram.ko" | head -n 1)
            [ -n "$zram_path" ] && break
          done
          if [ -z "$zram_path" ]; then
            zram_path=$(find "./kernel_workspace" -type f -name "zram.ko" | head -n 1)
          fi
          if [ -n "$zram_path" ] && [ -f "$zram_path" ]; then
            echo "ZRAM module file finally located at: $zram_path"
            mkdir -p "$(dirname "$target")"
            if [ "$(realpath "$zram_path")" != "$(realpath "$target")" ]; then
              cp "$zram_path" "$target"
            else
              echo "源文件与目标路径相同，跳过复制"
            fi
          else
            echo "未找到 zram.ko 文件，可能是未支持的内核版本或者未成功构建"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi


      - name: Post-build Disk Check
        run: df -h

