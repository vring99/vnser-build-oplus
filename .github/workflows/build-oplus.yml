            sched: true

    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2025"
      SCHED: ${{ matrix.sched }}
      ZRAM: true
      LSM: true
      FAST_BUILD: true
      KPM: ${{ matrix.kpm }}
