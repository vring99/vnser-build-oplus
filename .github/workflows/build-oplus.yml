name:  编译一加内核-sukisu-sufus

on:
  workflow_dispatch:  # This allows this workflow to be called from another workflow


jobs:
  build-kernel-oplus-sukisu-susfs:
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: oneplus_nord_ce4_lite_5g_v
            kpm: true
          - file: oneplus_nord_ce4_v
            kpm: true
          - file: oneplus_nord_4_v
            kpm: true
          - file: oneplus_ace_3v_v
            kpm: true
          - file: oneplus_10_pro_v
            kpm: true
          - file: oneplus_10t_v
            kpm: true
          - file: oneplus_11r_v
            kpm: true
          - file: oneplus_ace2_v
            kpm: true
          - file: oneplus_ace_pro_v
            kpm: true
          - file: oneplus_11_v
            kpm: true
          - file: oneplus_12r_v
            kpm: true
          - file: oneplus_ace2_pro_v
            kpm: true
          - file: oneplus_ace3_v
            kpm: true
          - file: oneplus_open_v
            kpm: true
          - file: oneplus12_v
            kpm: true
          - file: oneplus_13r
            kpm: true
          - file: oneplus_ace3_pro_v
            kpm: true
          - file: oneplus_ace5
            kpm: true
          - file: oneplus_pad_pro_v
            kpm: true
          - file: oneplus_pad2_v
            kpm: true
          - file: oneplus_nord_5
            kpm: true
          - file: oneplus_ace5_pro
            kpm: true
          - file: oneplus_13
            kpm: true
          - file: oneplus_13_global
            kpm: true
          - file: oneplus_13t
            kpm: true
          - file: oneplus_13s
            kpm: true
          - file: oneplus_pad_2_pro
            kpm: true


    uses: ./.github/workflows/build-kernel.yml
    secrets: inherit
    with:
      FILE: ${{ matrix.file }}
      HOOK: "manual"
      SUSFS_CI: "CI"
      KSU_META: "susfs-main/vring/"
      BUILD_TIME:  "Mon Aug 18 09:30:24 UTC 2025"
      KPM: ${{ matrix.kpm }}
      SCHED: true
      ZRAM: true
      LSM: true
      FAST_BUILD: true
