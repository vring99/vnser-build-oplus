name: oplus-bakasu-pro-35270-susfs-all

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      UNI:
        description: "启用 Unicode 绕过修复"
        required: false
        type: boolean
        default: true

concurrency:
  group: oplus-bakasu-pro-35270-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapdragon:
    name: "BakaSU Pro 35270 / Snapdragon"
    uses: ./.github/workflows/Build Kernel OnePlus Snapdragon.yml
    secrets: inherit
    with:
      BAKASU_VERSION: "35270"
      UNI: ${{ inputs.UNI }}

  mtk:
    name: "BakaSU Pro 35270 / MTK"
    uses: ./.github/workflows/Build Kernel OnePlus MTK.yml
    secrets: inherit
    with:
      BAKASU_VERSION: "35270"
      UNI: ${{ inputs.UNI }}
