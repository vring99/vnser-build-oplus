name: oplus-bakasu-35233-susfs-all

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      UNI:
        description: "启用 Unicode 绕过修复"
        required: false
        type: boolean
        default: false

concurrency:
  group: oplus-bakasu-35233-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapdragon:
    name: "BakaSU Pro 35233 / Snapdragon"
    uses: ./.github/workflows/Build Kernel OnePlus Snapdragon.yml
    secrets: inherit
    with:
      BAKASU_VERSION: "35233"
      UNI: ${{ inputs.UNI }}

  mtk:
    name: "BakaSU Pro 35233 / MTK"
    uses: ./.github/workflows/Build Kernel OnePlus MTK.yml
    secrets: inherit
    with:
      BAKASU_VERSION: "35233"
      UNI: ${{ inputs.UNI }}
