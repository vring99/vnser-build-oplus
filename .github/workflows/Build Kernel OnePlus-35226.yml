name: oplus-bakasu-pro-35235-susfs-all

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      UNI:
        description: "启用 Unicode 绕过修复"
        required: false
        type: boolean
        default: true

concurrency:
  group: oplus-bakasu-pro-35235-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapdragon:
    name: "BakaSU Pro 35235 / Snapdragon"
    uses: ./.github/workflows/Build Kernel OnePlus Snapdragon.yml
    secrets: inherit
    with:
      BAKASU_VERSION: "35235"
      UNI: ${{ inputs.UNI }}

  mtk:
    name: "BakaSU Pro 35235 / MTK"
    uses: ./.github/workflows/Build Kernel OnePlus MTK.yml
    secrets: inherit
    with:
      BAKASU_VERSION: "35235"
      UNI: ${{ inputs.UNI }}
